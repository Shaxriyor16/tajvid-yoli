name: tajvid_yoli
description: "Tajvid yo'li — Qur'on tajvid ta'lim ilovasi."
publish_to: 'none'
version: 1.0.1+2

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Firebase
  firebase_core: ^4.14.0
  firebase_auth: ^6.6.1
  cloud_firestore: ^6.7.1
  firebase_storage: ^13.4.5
  firebase_analytics: ^12.4.5
  firebase_crashlytics: ^5.2.6

  # State Management
  flutter_bloc: ^8.1.5
  equatable: ^2.0.5
  provider: ^6.1.2

  # Navigation
  go_router: ^14.1.0

  # UI & Design
  cupertino_icons: ^1.0.8
  intl: ^0.20.2

  # Utilities
  logger: ^2.3.0
  image_picker: ^1.1.2
  record: ^7.1.1
  path: ^1.9.0
  path_provider: ^2.1.3
  http: ^1.2.2
  crypto: ^3.0.3
  share_plus: ^10.1.4

  # Media
  just_audio: ^0.9.38
  rxdart: ^0.28.0

  # Local Database
  drift: ^2.18.0
  sqlite3_flutter_libs: ^0.5.22

  # Notifications & Permissions
  flutter_local_notifications: ^17.1.2
  permission_handler: ^11.3.1
  timezone: ^0.9.4
  flutter_timezone: ^3.0.1

  # Local Storage
  shared_preferences: ^2.2.3

  # Authentication
  google_sign_in: ^6.2.0
  sign_in_with_apple: ^8.1.0

  # AI / Gemini
  # Ads / Monetization
  cloud_functions: ^6.4.0
  firebase_app_check: ^0.4.7
  firebase_ai: ^4.0.0
  device_info_plus: ^11.5.0
  package_info_plus: ^9.0.1
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  drift_dev: ^2.18.0
  build_runner: ^2.4.9
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/icon/icon_legacy.png"
  image_path_ios: "assets/icon/icon_ios.png"
  remove_alpha_ios: true
  adaptive_icon_background: "assets/icon/adaptive_bg.png"
  adaptive_icon_foreground: "assets/icon/adaptive_fg.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  generate: true
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf
    - family: Chubbo
      fonts:
        - asset: assets/fonts/Chubbo-Bold.ttf
          weight: 700
    - family: Supreme
      fonts:
        - asset: assets/fonts/Supreme-Regular.ttf
          weight: 400
        - asset: assets/fonts/Supreme-Medium.ttf
          weight: 500
        - asset: assets/fonts/Supreme-Bold.ttf
          weight: 700
    - family: Amiri
      fonts:
        - asset: assets/fonts/Amiri-Regular.ttf
        - asset: assets/fonts/Amiri-Bold.ttf
          weight: 700
  assets:
    - assets/logo.png
    - assets/images/register_illustration.png
    - assets/images/prayer_times_illustration.png
    - assets/icons/google.png
    - assets/icons/apple.png
