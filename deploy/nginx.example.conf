# O'z serveringiz (VPS) uchun namuna. Domenni o'zingiznikiga almashtiring.
# SSL: certbot --nginx -d tajvidyoli.uz -d www.tajvidyoli.uz -d boshqaruv.tajvidyoli.uz

# ---------- Reklama sayti ----------
server {
    listen 80;
    server_name tajvidyoli.uz www.tajvidyoli.uz;
    root /var/www/tajvid/website;
    index index.html;

    # /privacy.html -> /privacy/ ; /index.html -> /
    rewrite ^/index\.html$ / permanent;
    rewrite ^/(privacy|terms|delete-account)\.html$ /$1/ permanent;

    location / { try_files $uri $uri/ =404; }
    error_page 404 /404.html;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location /fonts/ { expires 1y; add_header Cache-Control "public, immutable"; }
    location ~* \.apk$ {
        default_type application/vnd.android.package-archive;
        add_header Content-Disposition 'attachment; filename="tajvid-yoli.apk"';
    }
}

# ---------- Admin panel (alohida subdomen, begonalardan yopilgan) ----------
server {
    listen 80;
    server_name boshqaruv.tajvidyoli.uz;
    root /var/www/tajvid/admin;
    index index.html;

    # 1-eshik: parol (yaratish: htpasswd -c /etc/nginx/.admin_htpasswd admin)
    auth_basic "Yopiq hudud";
    auth_basic_user_file /etc/nginx/.admin_htpasswd;

    # (ixtiyoriy) faqat o'zingizning IP manzilingiz:
    # allow 1.2.3.4;
    # deny all;

    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Cache-Control "no-store" always;

    location / { try_files $uri $uri/ =404; }
}
